<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#2459a9">

<title>毎日の行動ノート</title>

<style>

*{box-sizing:border-box}

body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f2f5fb;color:#222}

header{background:#2459a9;color:white;padding:20px;border-radius:18px}

h1{font-size:25px;margin:0 0 8px}

h2{font-size:19px;margin-top:0}

h3{font-size:16px}

.card{background:white;padding:16px;border-radius:15px;margin:14px 0;box-shadow:0 2px 8px #0000000b}

input,textarea,button{font:inherit}

input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:9px;background:white}

textarea{min-height:85px;resize:vertical}

label{display:block;padding:6px 0}

button{border:0;border-radius:9px;padding:11px 14px;background:#2459a9;color:white;margin:5px 3px 5px 0}
